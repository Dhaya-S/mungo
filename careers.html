<body>
    <div class="screen-container"
        style="position: absolute; width: 1920px; height: auto; left: 0; top: 0; background-color: #ffffff;">


        <!-- React Mount Point for Careers content -->
        <div id="root" style="flex: 1; display: flex; flex-direction: column;"></div>


        <!-- Mount React Component -->
        <script type="module">
            import React from 'react'
            import ReactDOM from 'react-dom/client'
            import Careers from './src/Careers.jsx'
            import './src/index.css'

            ReactDOM.createRoot(document.getElementById('root')).render(
                React.createElement(React.StrictMode, null,
                    React.createElement(Careers)
                )
            )
        </script>

        <script>
            function resizeToFit() {
                if (window.innerWidth <= 1024) {
                    document.body.style.height = 'auto';
                    const container = document.querySelector('.screen-container');
                    if (container) container.style.transform = 'none';
                    return;
                }
                const container = document.querySelector('.screen-container');
                if (!container) return;
                const scale = window.innerWidth / 1920;
                container.style.transform = `scale(${scale})`;
                container.style.transformOrigin = 'top left';
                document.body.style.height = `${container.offsetHeight * scale}px`;
            }
            window.addEventListener('resize', resizeToFit);

            const observer = new ResizeObserver(resizeToFit);
            const container = document.querySelector('.screen-container');
            if (container) observer.observe(container);

            resizeToFit();

            // Hamburger Menu Logic
            const hamburger = document.getElementById('hamburger');
            const navLinks = document.getElementById('nav-links');
            if (hamburger && navLinks) {
                hamburger.addEventListener('click', () => {
                    hamburger.classList.toggle('open');
                    navLinks.classList.toggle('active');
                });
            }
        </script>
</body>

</html>
